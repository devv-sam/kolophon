<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Typography fixture</title>
    <style>
      body { font: 400 16px/24px Arial, sans-serif; }
      h1 { font: 700 32px/40px Georgia, serif; }
      button { font: 500 14px/20px Arial, sans-serif; letter-spacing: 0.5px; }
      .hidden { display: none; font-size: 50px; }
    </style>
  </head>
  <body>
    <h1>Heading</h1>
    <p>The first paragraph has the most text on the page.</p>
    <p>The second paragraph shares its style with the first.</p>
    <button>Action</button>
    <span class="hidden">Never rendered</span>
  </body>
</html>
