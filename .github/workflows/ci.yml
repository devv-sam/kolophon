name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm build
      - run: pnpm --filter @kolophon/mcp build
      # Ubuntu 24.04 runners block Chrome's sandbox via AppArmor; relax it here
      # rather than shipping --no-sandbox in the server.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @kolophon/mcp test
